<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #102141; }
    .head { background: #0b3d91; color: #fff; padding: 10px 14px; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .body { padding: 14px; }
    .name { font-size: 13px; line-height: 1.35; margin: 0 0 10px; max-height: 3.5em; overflow: hidden; }
    .row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .label { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; margin-bottom: 2px; }
    .price { font-size: 20px; font-weight: 700; color: #0b3d91; line-height: 1.1; }
    .stat { font-size: 14px; font-weight: 600; line-height: 1.1; }
    .low { color: #198754; }
    .high { color: #adb5bd; }
    .summary { font-size: 12px; color: #495057; line-height: 1.45; margin: 0 0 12px; }
    .muted { font-size: 13px; color: #6c757d; line-height: 1.45; margin: 0 0 12px; }
    .cta { display: block; text-align: center; background: #102141; color: #fff; text-decoration: none; font-size: 13px; font-weight: 600; padding: 9px 10px; border-radius: 50rem; }
    .cta:hover { background: #FAE391; color: #102141; }
  </style>
</head>
<body>
  <div class="head">PriceWatchPro</div>
  <div class="body" id="content">
    <p class="muted">Checking this page…</p>
  </div>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
